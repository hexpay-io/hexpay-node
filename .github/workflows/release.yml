name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Tag v$tag matches package.json version $pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        # Trusted Publishing via OIDC — no NPM_TOKEN needed.
        # Configure once at https://www.npmjs.com/settings/<org>/packages
        # → "Trusted Publisher" → add this GitHub repository + workflow file.
        #
        # Fallback if Trusted Publishing isn't available:
        #   1. Add an automation token to repo secrets as NPM_TOKEN.
        #   2. Replace this step with:
        #        env:
        #          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        #        run: npm publish --provenance --access public
        run: npm publish --provenance --access public
